[workspace]
resolver = "3"
members = ["common", "daemon", "applet"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Mark Middo"]
repository = "https://github.com/markmiddo/murmur"
homepage = "https://github.com/markmiddo/murmur"
keywords = ["dictation", "speech-to-text", "cosmic", "voice", "parakeet"]
categories = ["accessibility", "multimedia::audio"]

[workspace.dependencies]
murmur-common = { path = "common" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process"] }

[profile.release]
lto = "thin"
codegen-units = 4
